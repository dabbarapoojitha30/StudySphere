{% extends 'base.html' %}

{% block content %}

<div class="card">

<h2>Login</h2>

<form method="POST">

<input type="email"
       name="email"
       placeholder="Email"
       required>

<input type="password"
       name="password"
       placeholder="Password"
       required>

<button type="submit">
Login
</button>

</form>

<a href="/register">
Create Account
</a>

</div>

{% endblock %}
